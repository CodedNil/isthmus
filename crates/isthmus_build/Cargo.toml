[package]
edition.workspace = true
license.workspace = true
name = "isthmus_build"
version = "0.1.0"

[dependencies]
# Workspace crates
isthmus_syntax.workspace = true

# Shader compilation
spirv-builder = "0.11.0"

# Rust code generation
prettyplease = "0.3.0"
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["visit", "visit-mut"] }

# Cargo metadata and path encoding
cargo_metadata = "0.23.1"
form_urlencoded.workspace = true
toml = { workspace = true, features = ["display"] }

# Errors and files
anyhow = "1.0.104"
rustix = { version = "1.1.6", features = ["stdio"] }
tempfile.workspace = true

[lints]
workspace = true
