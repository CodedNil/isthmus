[package]
edition.workspace = true
license.workspace = true
name = "lares"
version = "0.1.0"

[dependencies]
# Rendering and scene data
bitflags.workspace = true
isthmus = { workspace = true, features = ["wayland"] }
isthmus_2d.workspace = true

# Wayland windowing
calloop.workspace = true
calloop-wayland-source.workspace = true
wayland-client.workspace = true
wayland-protocols = { workspace = true, features = ["unstable"] }

# Presence sensor and async execution
futures-util.workspace = true
serde.workspace = true
serde_json = "1.0.154"
tokio.workspace = true
tokio-tungstenite.workspace = true

# Baked lighting compression
flate2 = "1.1.11"

# Diagnostics
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
# Shader compilation
isthmus_build.workspace = true

[dev-dependencies]
# Image export and comparisons
image = { workspace = true, features = ["png", "webp"] }

# Material enumeration
strum.workspace = true
strum_macros.workspace = true

[lints]
workspace = true
