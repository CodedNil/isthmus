[package]
name = "lares"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bitflags.workspace = true
isthmus.workspace = true
flate2 = "1.1.10"
serde.workspace = true
serde_json = "1.0.154"
web-time.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "ws",
    "json",
    "tokio",
] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = "0.29.0"
tower-http = { version = "0.7.1", default-features = false, features = ["fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-events.workspace = true
gloo-render.workspace = true
tokio = { workspace = true, features = ["sync"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "Document",
    "HtmlCanvasElement",
    "PointerEvent",
    "WheelEvent",
    "Window",
    "console",
    "WebSocket",
    "Location",
    "MessageEvent",
    "CloseEvent",
] }

[build-dependencies]
isthmus-build.workspace = true

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["webp", "png"] }

[lints]
workspace = true

[package.metadata.isthmus]
optimize-shaders = true
