[package]
edition.workspace = true
license.workspace = true
name = "lares"
version = "0.1.0"

[dependencies]
# Workspace crates
isthmus = { workspace = true, features = ["wayland"] }
isthmus_2d.workspace = true

# Scene data and baked lighting
bitflags = "2.13.2"
flate2.workspace = true

# Wayland
calloop.workspace = true
calloop-wayland-source.workspace = true
wayland-client.workspace = true
wayland-protocols = { workspace = true, features = ["unstable"] }

# Async runtime and networking
futures-util.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true

# Presence sensor messages
serde.workspace = true
serde_json.workspace = true

# Diagnostics
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
# Shader compilation
isthmus_build.workspace = true

[dev-dependencies]
# Image export and comparisons
image = { workspace = true, features = ["png", "webp"] }

# Material enumeration
strum.workspace = true
strum_macros.workspace = true

[lints]
workspace = true
