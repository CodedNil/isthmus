[package]
name = "isthmus"
version = "0.1.0"
edition = "2024"

[dependencies]
isthmus_macros = { path = "../isthmus_macros" }
spirv-std.workspace = true

[target.'cfg(target_arch = "spirv")'.dependencies]
glam = { workspace = true, features = ["libm"] }

[target.'cfg(not(target_arch = "spirv"))'.dependencies]
bytemuck.workspace = true
glam = { workspace = true, features = ["std"] }
half = { version = "2.7.1", default-features = false }
slotmap = "1.1.1"
smallvec.workspace = true
thiserror = "2.0.20"
web-time = "1.1.0"
wgpu = { workspace = true, features = ["std", "vulkan", "webgpu", "wgsl"] }

[lints]
workspace = true
