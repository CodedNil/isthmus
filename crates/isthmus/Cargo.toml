[package]
edition.workspace = true
license.workspace = true
name = "isthmus"
version = "0.1.0"

[features]
wayland = ["dep:wayland-client", "dep:wayland-backend"]

[dependencies]
# Shared shader ABI and macros
isthmus_abi.workspace = true
isthmus_macros.workspace = true

# Shader runtime
spirv-std.workspace = true

[target.'cfg(not(target_arch = "spirv"))'.dependencies]
# GPU rendering and image data
bytemuck.workspace = true
half = "2.7.1"
ash.workspace = true
ash-allocator.workspace = true
gpu-allocator.workspace = true
raw-window-handle.workspace = true
wayland-client = { workspace = true, optional = true }
wayland-backend = { workspace = true, optional = true }

# Resource collections
slotmap = "1.1.1"
smallvec.workspace = true

# Errors and diagnostics
thiserror = "2.0.21"
tracing.workspace = true

[lints]
workspace = true
