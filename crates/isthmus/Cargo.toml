[package]
edition.workspace = true
license.workspace = true
name = "isthmus"
version = "0.1.0"

[features]
wayland = ["dep:wayland-client", "dep:wayland-backend"]

[dependencies]
# Workspace crates
isthmus_abi.workspace = true
isthmus_macros.workspace = true

# Shader runtime
spirv-std = "0.11.0"

[target.'cfg(not(target_arch = "spirv"))'.dependencies]
# Vulkan
ash = { git = "https://github.com/ash-rs/ash.git", rev = "80e5856982af6651d56337f9a10e46308145c2d2" }
# gpu-allocator 0.28 uses the crates.io ash API.
ash-allocator = { package = "ash", version = "0.38.0" }
gpu-allocator = { version = "0.28.0", default-features = false, features = [
    "std",
    "vulkan",
] }

# Window handles and Wayland
raw-window-handle = { version = "0.6.2", features = ["alloc"] }
wayland-backend = { version = "0.3.17", features = ["rwh_06"], optional = true }
wayland-client = { workspace = true, optional = true }

# Image data and resource collections
bytemuck.workspace = true
half = "2.7.1"
slotmap = "1.1.1"
smallvec.workspace = true

# Errors and diagnostics
thiserror = "2.0.21"
tracing.workspace = true

[lints]
workspace = true
