syntax = "proto3";

package spotify.collection.v2;

// Wire fields verified against go-librespot's collection/v2 implementation.
message CollectionItem {
    string uri = 1;
    int64 added_at = 2;
    bool is_removed = 3;
}

message WriteRequest {
    string username = 1;
    string set = 2;
    repeated CollectionItem items = 3;
}
