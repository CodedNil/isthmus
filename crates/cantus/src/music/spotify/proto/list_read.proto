syntax = "proto3";

package spotify.list.v1;

message GetListsRequest {
    repeated GetListRequest requests = 1;
}

message GetListRequest {
    ListIdentifier identifier = 1;
    RequestOptions options = 2;
}

message ListIdentifier {
    string uri = 1;
}

message RequestOptions {
    RequestedFields requested_fields = 4;
}

message RequestedFields {
    ListResponseRequestedFields list_response = 2;
}

message ListResponseRequestedFields {
    ListEntityRequestedFields entity = 1;
}

message ListEntityRequestedFields {
    AttributesRequestedFields attributes = 1;
    ItemRequestedFields items = 2;
    MetaItemsRequestedFields meta_items = 3;
}

message ItemRequestedFields {
    AttributesRequestedFields attributes = 2;
}

message MetaItemsRequestedFields {
    AttributesRequestedFields attributes = 1;
}

message AttributesRequestedFields {
    repeated AttributeKind requested_field = 1;
}

enum AttributeKind {
    KIND_UNSPECIFIED = 0;
    KIND_URI = 1;
    KIND_NAME = 3;
    KIND_PICTURE_FILE_ID = 20;
    KIND_PICTURE_SIZES = 21;
}

message GetListsResponse {
    repeated GetListResponse responses = 1;
}

message GetListResponse {
    ListEntity entity = 1;
    ResponseInfo info = 2;
}

message ListEntity {
    Attributes attributes = 1;
    repeated ListItem items = 2;
    map<string, MetaItem> meta_items = 3;
}

message ListItem {
    Attributes attributes = 2;
}

message MetaItem {
    Attributes attributes = 1;
    ResponseInfo info = 2;
}

message Attributes {
    string uri = 1;
    string name = 3;
    bytes picture_file_id = 20;
    PictureSizes picture_sizes = 21;
}

message PictureSizes {
    repeated PictureSize picture_size = 1;
}

message PictureSize {
    string url = 2;
}

message ResponseInfo {
    RequestError request_error = 1;
    bytes revision = 7;
}

message RequestError {
    string message = 6;
}
