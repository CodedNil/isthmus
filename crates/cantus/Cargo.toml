[package]
name = "cantus"
version = "0.8.0"
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arrayvec = { version = "0.7.8", features = ["serde"] }
fastrand = "2.5.0"
fend-core = "1.5.8"
form_urlencoded.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = [
    "std",
] }
image = { version = "0.25.10", default-features = false, features = [
    "ico",
    "jpeg",
    "png",
] }
isthmus.workspace = true
isthmus_sdf.workspace = true
jiff = { version = "0.2.38", default-features = false, features = [
    "js",
    "serde",
    "tz-system",
    "tzdb-bundle-always",
] }
palette = { version = "0.7.7", default-features = false, features = ["std"] }
reqwest = { version = "0.12.28", default-features = false, features = [
    "json",
    "rustls-tls-webpki-roots",
] }
resvg = { version = "0.48.1", default-features = false, features = [
    "raster-images",
] }
roxmltree = "0.21.1"
serde.workspace = true
serde_json = { version = "1.0.151", features = ["raw_value"] }
smallvec.workspace = true
tokio = { workspace = true, features = ["macros", "sync"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-segmentation = "1.13.3"
web-time.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
bytemuck.workspace = true
calloop = "0.14"
calloop-wayland-source = "0.4.1"
flate2 = "1.1.10"
freedesktop-desktop-entry = { version = "0.8.3", default-features = false }
freedesktop-icons = "0.4.0"
librespot-core = { version = "0.8.0", default-features = false, features = [
    "rustls-tls-webpki-roots",
] }
librespot-metadata = { version = "0.8.0", default-features = false, features = [
    "rustls-tls-webpki-roots",
] }
librespot-oauth = { version = "0.8.0", default-features = false, features = [
    "rustls-tls-webpki-roots",
] }
librespot-protocol = "0.8.0"
microfft = { version = "0.6.0", default-features = false, features = [
    "size-1024",
    "std",
] }
nvml-wrapper = "0.13.0"
pollster.workspace = true
protobuf = "3.7.2"
schemars = { version = "1.2.2", features = ["arrayvec07", "preserve_order"] }
smithay-clipboard = { version = "0.7.3", default-features = false }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "time"] }
wayland-backend.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
wayland-protocols-wlr.workspace = true
xkbcommon = { version = "0.9.0", default-features = false }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-events.workspace = true
gloo-render.workspace = true
gloo-timers = { version = "0.4.0", features = ["futures"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "Clipboard",
    "ClipboardEvent",
    "Coordinates",
    "DataTransfer",
    "Document",
    "Geolocation",
    "HtmlCanvasElement",
    "KeyboardEvent",
    "Navigator",
    "PointerEvent",
    "Position",
    "WheelEvent",
    "Window",
    "console",
] }

[build-dependencies]
isthmus-build.workspace = true
# librespot-core 0.8's vergen-gitcl build dependency is incompatible with vergen 9.1.
vergen = "=9.0.6"

[lints]
workspace = true
