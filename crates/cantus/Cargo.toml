[package]
name = "cantus"
version = "0.9.1"
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arrayvec = { version = "0.7.8", features = ["serde"] }
fastrand = "2.5.0"
fend-core = "1.5.9"
form_urlencoded.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = [
    "std",
] }
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
] }
isthmus.workspace = true
isthmus_2d.workspace = true
jiff = { version = "1.0.1", default-features = false, features = [
    "js",
    "serde",
    "tz-system",
    "tzdb-bundle-always",
] }
palette = { version = "0.7.7", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "form", "http2", "json", "query", "rustls",
] }
resvg = { version = "0.50.0", default-features = false, features = [
    "raster-images",
] }
roxmltree = "0.21.2"
serde.workspace = true
serde_json = "1.0.154"
serde-saphyr = { version = "2.2.0", default-features = false, features = [
    "deserialize",
    "serialize",
] }
sha2 = "0.11.1"
hex = "0.4.3"
smallvec.workspace = true
strum_macros = "0.28.0"
tokio = { workspace = true, features = ["macros", "sync"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-segmentation = "1.13.3"
web-time.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
base64 = "0.23.1"
bytemuck.workspace = true
bytes = "1.12.2"
calloop = "0.14"
calloop-wayland-source = "0.4.1"
flate2 = "1.1.11"
freedesktop-desktop-entry = { version = "0.8.4", default-features = false }
freedesktop-icons = "0.4.0"
futures-util = { version = "0.3.34", default-features = false, features = [
    "sink",
] }
getrandom = "0.4.3"
microfft = { version = "0.6.0", default-features = false, features = [
    "size-1024",
    "std",
] }
notify = "8.2.2"
pollster.workspace = true
protobuf = "3.7.2"
schemars = { version = "1.2.3", features = ["arrayvec07", "preserve_order"] }
smithay-clipboard = { version = "0.7.3", default-features = false }
tempfile = "3.27.0"
tokio = { workspace = true, features = [
    "io-util",
    "net",
    "rt-multi-thread",
    "time",
] }
tokio-tungstenite = { version = "0.30.0", features = [
    "rustls-tls-webpki-roots",
] }
wayland-backend.workspace = true
wayland-client.workspace = true
wayland-protocols-wlr.workspace = true
wayland-protocols.workspace = true
xkbcommon = { version = "0.9.0", default-features = false }
zbus = { version = "6.3.0", default-features = false, features = [
    "proxy",
    "tokio",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-events.workspace = true
gloo-render.workspace = true
gloo-timers = { version = "0.4.1", features = ["futures"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "Clipboard",
    "ClipboardEvent",
    "DataTransfer",
    "Document",
    "HtmlCanvasElement",
    "KeyboardEvent",
    "Navigator",
    "PointerEvent",
    "WheelEvent",
    "Window",
    "console",
] }

[build-dependencies]
isthmus_build.workspace = true
protobuf = "3.7.2"
protobuf-codegen = "3.7.2"

[lints]
workspace = true
