[package]
edition.workspace = true
license.workspace = true
name = "cantus"
version = "0.10.0"

[dependencies]
# Rendering and media analysis
bytemuck.workspace = true
image = { workspace = true, features = ["jpeg", "png"] }
isthmus = { workspace = true, features = ["wayland"] }
isthmus_2d.workspace = true
microfft = { version = "0.6.0", default-features = false, features = [
    "size-1024",
    "std",
] }
palette = { version = "0.7.7", default-features = false, features = ["std"] }
resvg = { version = "0.50.0", default-features = false, features = [
    "raster-images",
] }

# Wayland and desktop integration
calloop.workspace = true
calloop-wayland-source.workspace = true
freedesktop-desktop-entry = { version = "0.8.4", default-features = false }
freedesktop-icons = "0.4.0"
notify = "9.0.0"
wayland-client.workspace = true
wayland-protocols.workspace = true
wayland-protocols-wlr.workspace = true
xkbcommon = { version = "0.9.0", default-features = false }
zbus = { version = "6.5.0", default-features = false, features = [
    "proxy",
    "service",
    "tokio",
] }

# HTTP, WebSockets, and async execution
bytes = "1.12.2"
futures-util.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = [
    "form",
    "gzip",
    "http2",
    "json",
    "query",
    "rustls",
] }
tokio = { workspace = true, features = ["io-util"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }

# Music protocols and authentication
base64 = "0.23.1"
flate2 = "1.1.11"
form_urlencoded.workspace = true
getrandom = "0.4.3"
hex = "0.4.3"
prost = "0.14.6"
prost-types = "0.14.6"
roxmltree = "0.21.2"
sha2 = "0.11.1"
tempfile = "3.27.0"

# Configuration and serialization
schemars = { version = "1.2.3", features = ["arrayvec07", "preserve_order"] }
serde.workspace = true
serde-saphyr = { version = "2.2.0", default-features = false, features = [
    "deserialize",
    "serialize",
] }
serde_json = "1.0.154"
toml.workspace = true

# Launcher and local utilities
fastrand = "2.5.0"
fend-core = "1.5.9"
jiff = { version = "1.0.2", default-features = false, features = [
    "serde",
    "tz-system",
    "tzdb-zoneinfo",
] }
unicode-segmentation = "1.13.3"

# Collections and enum derives
arrayvec = { version = "0.7.8", features = ["serde"] }
smallvec.workspace = true
strum.workspace = true
strum_macros.workspace = true

# Diagnostics
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
isthmus_build.workspace = true

[lints]
workspace = true
