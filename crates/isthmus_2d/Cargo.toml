[package]
edition.workspace = true
name = "isthmus_2d"
version = "0.1.0"

[dependencies]
# Rendering
isthmus.workspace = true

[target.'cfg(not(target_arch = "spirv"))'.dependencies]
# Text shaping and outlines
harfrust = "0.16.1"
kurbo = "0.13.1"
skrifa = { version = "0.50.0", default-features = false, features = ["std"] }

# Glyph caching
hashbrown = { version = "0.17.1", default-features = false, features = [
    "default-hasher",
    "inline-more",
] }

[lints]
workspace = true
