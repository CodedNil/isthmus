[workspace]
resolver = "3"
members = [
    "crates/isthmus",
    "crates/isthmus_build",
    "crates/isthmus_macros",
    "crates/cantus",
]

[workspace.dependencies]
bytemuck = { version = "1.25.2", features = ["derive", "min_const_generics"] }
glam = { version = "0.33.5", default-features = false, features = ["bytemuck", "u32"] }
spirv-builder = { git = "https://github.com/Rust-GPU/rust-gpu", rev = "9453497884c28bd52405f0abc9bfc7d0b3374666" }
spirv-std = { git = "https://github.com/Rust-GPU/rust-gpu", rev = "9453497884c28bd52405f0abc9bfc7d0b3374666" }
serde = { version = "1.0.229", features = ["derive"] }
smallvec = "1.15.2"
raw-window-handle = "0.6.2"
pollster = "1.0.1"
wgpu = { version = "30.0.1", default-features = false }
ttf-parser = "0.25.1"

[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [
    'cfg(target_arch, values("spirv"))',
] }
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
must_use_candidate = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
suboptimal_flops = "allow"

absolute_paths = "warn"
separated_literal_suffix = "warn"
renamed_function_params = "warn"
str_to_string = "warn"
if_then_some_else_none = "warn"
redundant_type_annotations = "warn"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
strip = true
panic = "abort"

[profile.release.build-override]
opt-level = 0
codegen-units = 256

[profile.dev]
opt-level = 1
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3
